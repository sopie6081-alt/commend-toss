<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ScopeNote — 작업 범위를 명확하게</title>
    <style>
        :root {
            --bg: #f5f6fa;
            --surface: #fff;
            --ink: #192133;
            --muted: #738096;
            --line: #e5e9f1;
            --brand: #6458e8;
            --brand-soft: #eeecff;
            --green: #16836a;
            --red: #bd4255;
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        button,
        input,
        textarea,
        select {
            font: inherit
        }

        button {
            cursor: pointer
        }

        button:disabled {
            cursor: default;
            opacity: .5
        }

        button,
        input,
        textarea,
        select {
            border-radius: 10px
        }

        button {
            border: 1px solid var(--line);
            background: white;
            color: var(--ink);
            padding: 10px 15px;
        }

        button:hover {
            background: #f4f3ff
        }

        button.primary {
            background: var(--brand);
            border-color: var(--brand);
            color: white
        }

        button.danger {
            color: var(--red)
        }

        button:focus-visible,
        a:focus-visible {
            outline: 3px solid #a69fff;
            outline-offset: 3px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--line);
            background: white;
            color: var(--ink);
        }

        textarea {
            resize: vertical;
            min-height: 110px
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: 2px solid #d2cdff;
            border-color: var(--brand);
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin: 16px 0 7px
        }

        h1,
        h2,
        h3,
        p {
            margin-top: 0
        }

        h1 {
            font-size: 30px;
            letter-spacing: -1px;
            line-height: 1.3
        }

        h2 {
            font-size: 20px;
            letter-spacing: -.5px
        }

        h3 {
            font-size: 16px
        }

        small,
        .muted {
            color: var(--muted)
        }

        .app {
            display: grid;
            grid-template-columns: 245px 1fr;
            min-height: 100vh
        }

        aside {
            background: var(--surface);
            padding: 30px 20px;
            border-right: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .logo {
            font-size: 23px;
            font-weight: 800;
            letter-spacing: -1px
        }

        .logo span {
            color: var(--brand)
        }

        .nav {
            display: grid;
            gap: 7px
        }

        .nav button {
            text-align: left;
            border: 0;
            background: transparent
        }

        .nav button.active {
            background: var(--brand-soft);
            color: var(--brand);
            font-weight: 700
        }

        .side-note {
            margin-top: auto;
            background: var(--bg);
            border-radius: 14px;
            padding: 16px;
            font-size: 12px;
            color: var(--muted);
        }

        main {
            width: 100%;
            max-width: 1250px;
            padding: 40px;
            margin: auto
        }

        .top,
        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px
        }

        .top {
            margin-bottom: 28px
        }

        .eyebrow {
            color: var(--brand);
            font-size: 11px;
            letter-spacing: 2px;
            font-weight: 800;
            margin-bottom: 10px
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px
        }

        .columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
            align-items: start
        }

        .card {
            background: white;
            border: 1px solid var(--line);
            padding: 24px;
            border-radius: 17px
        }

        .stat strong {
            display: block;
            margin-top: 8px;
            font-size: 30px;
            line-height: 1.2
        }

        .section {
            margin-top: 28px
        }

        .project {
            transition: transform .15s, box-shadow .15s
        }

        .project:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px #26335a09
        }

        .icon {
            width: 43px;
            height: 43px;
            display: grid;
            place-items: center;
            border-radius: 12px;
            color: var(--brand);
            background: var(--brand-soft);
            font-weight: 800;
            margin-bottom: 20px;
        }

        .badge {
            display: inline-block;
            padding: 4px 9px;
            border-radius: 7px;
            font-size: 11px;
            background: var(--brand-soft);
            color: var(--brand);
            white-space: nowrap;
        }

        .badge.green {
            color: var(--green);
            background: #e8f7f0
        }

        .badge.gray {
            color: var(--muted);
            background: #f0f2f6
        }

        .notice {
            padding: 13px 16px;
            background: var(--brand-soft);
            color: #514997;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .empty {
            text-align: center;
            padding: 50px 20px
        }

        .empty p {
            color: var(--muted)
        }

        .divider {
            border: 0;
            border-top: 1px solid var(--line);
            margin: 20px 0
        }

        .pre {
            white-space: pre-wrap;
            overflow-wrap: anywhere
        }

        .request {
            border: 1px solid var(--line);
            padding: 15px;
            border-radius: 12px;
            margin-top: 12px
        }

        .request textarea {
            min-height: 75px
        }

        .request select {
            margin: 10px 0
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 18px
        }

        .back {
            margin-bottom: 20px
        }

        .amount {
            color: var(--brand);
            font-size: 25px;
            font-weight: 800
        }

        .history-item {
            padding: 18px 0;
            border-bottom: 1px solid var(--line)
        }

        .history-item:last-child {
            border-bottom: 0
        }

        dialog {
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 30px;
            width: min(650px, calc(100% - 28px));
            max-height: 90vh;
        }

        dialog::backdrop {
            background: #17203370;
            backdrop-filter: blur(4px)
        }

        #toast {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 20px;
            border-radius: 12px;
            background: #192133;
            color: white;
            box-shadow: 0 8px 30px #0002;
            z-index: 10;
            max-width: 90%;
            display: none;
        }

        @media(max-width:900px) {
            .app {
                grid-template-columns: 1fr
            }

            aside {
                padding: 15px 20px;
                border-right: 0;
                border-bottom: 1px solid var(--line)
            }

            aside .nav {
                display: flex;
                flex-wrap: wrap
            }

            .side-note {
                display: none
            }

            main {
                padding: 24px 18px
            }

            .grid,
            .columns {
                grid-template-columns: 1fr
            }

            .stats {
                grid-template-columns: repeat(3, 1fr);
                gap: 8px
            }

            .stat {
                padding: 14px
            }

            .stat strong {
                font-size: 24px
            }

            .top {
                align-items: flex-start
            }

            h1 {
                font-size: 25px
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <aside>
            <div class="logo"><span>◈</span> ScopeNote</div>
            <nav class="nav" aria-label="메인 메뉴">
                <button id="navHome" class="active" onclick="goHome()">프로젝트</button>
                <button id="navHistory" onclick="showHistory()">승인 이력</button>
            </nav>
            <div class="side-note">
                <strong>합의하고, 시작하세요.</strong><br>
                작업 범위와 추가 요청을 한곳에서 관리하세요.
                <hr class="divider">
                로컬 프로토타입<br>
                데이터는 이 브라우저에만 저장됩니다.
            </div>
        </aside>
        <main id="main"></main>
    </div>

    <dialog id="projectDialog">
        <form id="projectForm">
            <div class="row">
                <h2 style="margin:0">새 프로젝트</h2>
                <button type="button" onclick="closeDialog('projectDialog')" aria-label="닫기">✕</button>
            </div>
            <label for="projectName">프로젝트명</label>
            <input id="projectName" required maxlength="100" placeholder="브랜드 웹사이트 디자인">
            <label for="clientName">고객명</label>
            <input id="clientName" required maxlength="100" placeholder="고객 또는 회사 이름">
            <label for="baseScope">합의한 작업 범위</label>
            <textarea id="baseScope" required maxlength="20000" rows="6"
                placeholder="산출물, 페이지 수, 수정 횟수, 제외 작업 등을 작성하세요."></textarea>
            <div class="columns" style="gap:15px">
                <div>
                    <label for="basePrice">계약 금액 · 원</label>
                    <input id="basePrice" type="number" min="0" max="1000000000000" step="1" required>
                </div>
                <div>
                    <label for="baseDeadline">납기</label>
                    <input id="baseDeadline" type="date" required>
                </div>
            </div>
            <label for="taxPolicy">금액 표기 기준</label>
            <select id="taxPolicy">
                <option>부가세 포함</option>
                <option>부가세 별도</option>
            </select>
            <div class="actions">
                <button class="primary" type="submit">기준 범위 확정</button>
                <button type="button" onclick="closeDialog('projectDialog')">취소</button>
            </div>
        </form>
    </dialog>

    <dialog id="previewDialog"></dialog>
    <div id="toast" role="status" aria-live="polite"></div>

    <script>
        const KEY = "scopenote-prototype-v1";
        const $ = id => document.getElementById(id);
        const escapeHTML = value => String(value ?? "").replace(/[&<>"']/g, c => ({
            "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
        }[c]));
        const money = value => new Intl.NumberFormat("ko-KR").format(value) + "원";
        const timestamp = value => new Date(value).toLocaleString("ko-KR");
        const uid = () => crypto.randomUUID();
        let state = { projects: [] };
        let selectedId = null;
        let requests = [];
        let toastTimer;

        try {
            const saved = JSON.parse(localStorage.getItem(KEY) || "null");
            if (saved && Array.isArray(saved.projects)) state = saved;
        } catch {
            alert("저장된 데이터를 읽지 못했습니다. 새 세션으로 시작합니다.");
        }

        function notify(text) {
            $("toast").textContent = text;
            $("toast").style.display = "block";
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => $("toast").style.display = "none", 3500);
        }

        /* Persist before committing the in-memory change. */
        function commit(mutator) {
            const next = structuredClone(state);
            mutator(next);
            try {
                localStorage.setItem(KEY, JSON.stringify(next));
                state = next;
                return true;
            } catch {
                notify("저장 공간 또는 브라우저 설정 때문에 저장하지 못했습니다.");
                return false;
            }
        }

        function currentProject() {
            return state.projects.find(p => p.id === selectedId);
        }

        function currentScope(p) {
            return [p.scope, ...p.proposals.filter(x => x.status === "승인")
                .map(x => `[승인된 변경 · v${x.version}]\n${x.scope}`)].join("\n\n");
        }

        function currentDeadline(p) {
            const approved = p.proposals.filter(x => x.status === "승인");
            return approved.length ? approved[approved.length - 1].deadline : p.deadline;
        }

        function totalPrice(p) {
            return p.price + p.proposals.filter(x => x.status === "승인")
                .reduce((sum, x) => sum + x.amount, 0);
        }

        function badge(status) {
            const cls = status === "승인" ? "green" : status === "응답 대기" ? "" : "gray";
            return `<span class="badge ${cls}">${escapeHTML(status)}</span>`;
        }

        function nav(history = false) {
            $("navHome").classList.toggle("active", !history);
            $("navHistory").classList.toggle("active", history);
        }

        function goHome() {
            selectedId = null;
            requests = [];
            nav();
            const pending = state.projects.flatMap(p => p.proposals)
                .filter(x => x.status === "응답 대기").length;
            const approved = state.projects.flatMap(p => p.proposals)
                .filter(x => x.status === "승인").length;

            $("main").innerHTML = `
    <header class="top">
      <div>
        <div class="eyebrow">YOUR WORK, CLEARLY DEFINED</div>
        <h1>작업에 집중하세요.<br>합의는 여기에 남기세요.</h1>
        <p class="muted">고객의 새 요청부터 변경 승인까지, 한곳에서.</p>
      </div>
      <button class="primary" onclick="openProjectDialog()">＋ 새 프로젝트</button>
    </header>
    <div class="grid stats">
      <div class="card stat"><small>전체 프로젝트</small><strong>${state.projects.length}</strong></div>
      <div class="card stat"><small>응답 대기</small><strong>${pending}</strong></div>
      <div class="card stat"><small>승인된 변경</small><strong>${approved}</strong></div>
    </div>
    <section class="section">
      <div class="row"><h2>내 프로젝트</h2><small>브라우저 자동 저장</small></div>
      ${state.projects.length ? `<div class="grid">
        ${state.projects.map(p => `
          <article class="card project">
            <div class="icon">${escapeHTML(p.name.slice(0, 1))}</div>
            <small>${escapeHTML(p.client)}</small>
            <h2 style="margin:5px 0 18px">${escapeHTML(p.name)}</h2>
            <div class="row"><small>현재 합의 금액</small><strong>${money(totalPrice(p))}</strong></div>
            <div class="row"><small>현재 납기</small><span>${escapeHTML(currentDeadline(p))}</span></div>
            <hr class="divider">
            <div class="row">
              ${badge(p.proposals.some(x => x.status === "응답 대기") ? "응답 대기" : "진행 중")}
              <button onclick="openProject('${p.id}')">프로젝트 열기 →</button>
            </div>
          </article>`).join("")}
      </div>` : `
        <div class="card empty">
          <h2>첫 프로젝트의 범위를 정해보세요</h2>
          <p>합의한 내용이 있으면 새 요청을 검토하기 쉬워집니다.</p>
          <button class="primary" onclick="openProjectDialog()">프로젝트 만들기</button>
        </div>`}
    </section>`;
        }

        function openProjectDialog() {
            $("projectForm").reset();
            $("projectDialog").showModal();
        }

        function closeDialog(id) {
            $(id).close();
        }

        $("projectForm").addEventListener("submit", event => {
            event.preventDefault();
            const name = $("projectName").value.trim();
            const client = $("clientName").value.trim();
            const scope = $("baseScope").value.trim();
            if (!name || !client || !scope) return notify("프로젝트명, 고객명, 작업 범위를 입력하세요.");
            const project = {
                id: uid(), name, client, scope,
                price: Number($("basePrice").value),
                deadline: $("baseDeadline").value,
                tax: $("taxPolicy").value,
                proposals: [], createdAt: new Date().toISOString()
            };
            if (!commit(s => s.projects.unshift(project))) return;
            closeDialog("projectDialog");
            openProject(project.id);
            notify("기준 범위를 저장했습니다.");
        });

        function openProject(id) {
            selectedId = id;
            requests = [];
            nav();
            renderProject();
        }

        function renderProject() {
            const p = currentProject();
            if (!p) return goHome();
            const pending = p.proposals.some(x => x.status === "응답 대기");

            $("main").innerHTML = `
    <button class="back" onclick="goHome()">← 프로젝트 목록</button>
    <header class="top">
      <div><div class="eyebrow">PROJECT WORKSPACE</div>
        <h1>${escapeHTML(p.name)}</h1><span class="muted">${escapeHTML(p.client)}</span>
      </div>${badge(pending ? "응답 대기" : "진행 중")}
    </header>
    <div class="columns">
      <section class="card">
        <h2>현재 합의한 범위</h2>
        <p class="muted">최초 범위와 승인된 변경을 함께 표시합니다.</p>
        <div class="pre">${escapeHTML(currentScope(p))}</div>
        <hr class="divider">
        <div class="row"><span>합의 금액</span><strong>${money(totalPrice(p))}</strong></div>
        <div class="row"><span>납기</span><strong>${escapeHTML(currentDeadline(p))}</strong></div>
        <small>${escapeHTML(p.tax)} · 승인 금액은 실제 수금액과 다릅니다.</small>
      </section>
      <section class="card">
        <h2>새 고객 요청</h2>
        <div class="notice">현재 버전은 줄 단위로 요청을 나눕니다. 작업 범위 분류는 직접 검토해주세요.</div>
        <label for="requestInput">고객 메시지</label>
        <textarea id="requestInput" maxlength="5000" placeholder="요청을 한 줄에 하나씩 입력하세요."></textarea>
        <div class="actions">
          <button class="primary" onclick="splitRequests()" ${pending ? "disabled" : ""}>요청 정리하기</button>
        </div>
        ${pending ? `<p class="muted">기존 제안을 승인하거나 철회한 뒤 새 제안을 작성할 수 있습니다.</p>` : ""}
        <div id="requestList"></div>
      </section>
    </div>
    <section class="section card">
      <div class="row"><h2>변경 제안</h2><small>${p.proposals.length}건</small></div>
      ${p.proposals.length ? [...p.proposals].reverse().map(x => `
        <article class="history-item">
          <div class="row"><strong>변경 제안 v${x.version}</strong>${badge(x.status)}</div>
          <p class="pre" style="margin:12px 0">${escapeHTML(x.scope)}</p>
          <small>추가 ${money(x.amount)} · 납기 ${escapeHTML(x.deadline)}</small>
          ${x.decisionAt ? `<p class="muted">${escapeHTML(x.signer)} · ${timestamp(x.decisionAt)}
            ${x.comment ? `<br>${escapeHTML(x.comment)}` : ""}</p>` : ""}
          <div class="actions">
            <button onclick="preview('${x.id}')">고객 화면 미리보기</button>
            ${x.status === "응답 대기" ? `<button class="danger" onclick="withdraw('${x.id}')">제안 철회</button>` : ""}
          </div>
        </article>`).join("") : `<p class="muted">아직 변경 제안이 없습니다. 고객 요청을 입력해 시작하세요.</p>`}
    </section>`;
        }

        function splitRequests() {
            const raw = $("requestInput").value.trim();
            if (!raw) return notify("고객 요청을 먼저 입력하세요.");
            requests = raw.split(/\n+/).map(s => s.trim()).filter(Boolean)
                .map(text => ({ text, kind: "확인 필요" }));
            renderRequests();
        }

        function renderRequests() {
            const p = currentProject();
            $("requestList").innerHTML = `
    ${requests.map((r, i) => `
      <div class="request">
        <strong>요청 ${i + 1}</strong>
        <p class="pre" style="margin:8px 0">${escapeHTML(r.text)}</p>
        <label for="kind${i}">범위 분류</label>
        <select id="kind${i}">
          <option>확인 필요</option>
          <option>기존 범위에 포함</option>
          <option>추가 작업 후보</option>
        </select>
      </div>`).join("")}
    <hr class="divider">
    <h3>변경 제안 작성</h3>
    <p class="muted">‘추가 작업 후보’로 선택한 요청을 제안에 포함합니다.</p>
    <label for="extraAmount">추가 금액 · 원 · 비용이 없으면 0</label>
    <input id="extraAmount" type="number" min="0" max="1000000000000" step="1" placeholder="150000">
    <label for="newDeadline">변경 후 납기 · 동일하면 기존 날짜 유지</label>
    <input id="newDeadline" type="date" value="${escapeHTML(currentDeadline(p))}">
    <label for="proposalNote">고객에게 전달할 설명</label>
    <textarea id="proposalNote" maxlength="5000" placeholder="추가 요청에 따른 범위와 일정 변경 내용을 확인해주세요."></textarea>
    <label style="display:flex;gap:8px;align-items:flex-start">
      <input id="reviewed" type="checkbox" style="width:auto;margin-top:5px">
      요청 분류와 제안에 포함할 항목, 금액, 납기를 검토했습니다.
    </label>
    <div class="actions"><button class="primary" onclick="createProposal()">변경 제안 저장</button></div>`;
        }

        function createProposal() {
            const p = currentProject();
            if (p.proposals.some(x => x.status === "응답 대기"))
                return notify("응답 대기 중인 제안이 있습니다.");
            const classified = requests.map((r, i) => ({ ...r, kind: $("kind" + i).value }));
            if (classified.some(r => r.kind === "확인 필요"))
                return notify("모든 요청의 범위 분류를 먼저 확인하세요.");
            const added = classified.filter(r => r.kind === "추가 작업 후보");
            if (!added.length) return notify("추가 작업 후보를 하나 이상 선택하세요.");
            const amount = $("extraAmount");
            const deadline = $("newDeadline");
            if (amount.value === "" || !amount.checkValidity())
                return notify("유효한 추가 금액을 입력하세요.");
            if (!deadline.value || !deadline.checkValidity())
                return notify("납기를 입력하세요.");
            if (!$("reviewed").checked) return notify("검토 완료 항목을 체크해주세요.");
            const proposal = {
                id: uid(), version: p.proposals.length + 1,
                scope: added.map(r => "• " + r.text).join("\n"),
                amount: Number(amount.value), deadline: deadline.value,
                note: $("proposalNote").value.trim(),
                requests: classified,
                status: "응답 대기", createdAt: new Date().toISOString()
            };
            if (!commit(s => s.projects.find(x => x.id === p.id).proposals.push(proposal))) return;
            requests = [];
            renderProject();
            preview(proposal.id);
        }

        function preview(id) {
            const p = currentProject();
            const x = p.proposals.find(x => x.id === id);
            if (!x) return;
            $("previewDialog").innerHTML = `
    <div class="row">
      <div class="logo"><span>◈</span> ScopeNote</div>
      <button onclick="closeDialog('previewDialog')" aria-label="닫기">✕</button>
    </div>
    <div class="notice" style="margin-top:20px">
      고객 화면 미리보기입니다. 아래 결정은 로컬 테스트 데이터에 반영됩니다.
      외부 공유 링크는 생성되지 않습니다.
    </div>
    <small>${escapeHTML(p.client)} · ${escapeHTML(p.name)}</small>
    <h1 style="margin-top:8px">변경 내용을 확인해주세요</h1>
    ${badge(x.status)}
    <hr class="divider">
    <h3>변경 범위 · v${x.version}</h3>
    <div class="pre">${escapeHTML(x.scope)}</div>
    <hr class="divider">
    <div class="row"><span>추가 금액</span><span class="amount">${money(x.amount)}</span></div>
    <small>${escapeHTML(p.tax)}</small>
    <div class="row" style="margin-top:12px"><span>변경 후 납기</span><strong>${escapeHTML(x.deadline)}</strong></div>
    <p class="pre" style="margin-top:20px">${escapeHTML(x.note)}</p>
    <p class="muted">명시한 변경 외의 기존 합의 조건은 유지됩니다.</p>
    ${x.status === "응답 대기" ? `
      <label for="signer">확인자 이름</label>
      <input id="signer" maxlength="100" placeholder="이름을 입력하세요">
      <label for="decisionComment">의견 · 수정 요청 시 필수</label>
      <textarea id="decisionComment" maxlength="2000" placeholder="조정이 필요한 내용을 입력하세요."></textarea>
      <label style="display:flex;gap:8px;align-items:flex-start">
        <input id="approveCheck" type="checkbox" style="width:auto;margin-top:5px">
        표시된 변경 범위, 추가 금액, 납기를 확인하고 전체 승인합니다.
      </label>
      <div class="actions">
        <button class="primary" onclick="decide('${x.id}','승인')">전체 승인 테스트</button>
        <button onclick="decide('${x.id}','수정 요청')">수정 요청 테스트</button>
      </div>
      <p class="muted" style="font-size:12px;margin-top:16px">이름 입력은 본인 인증이나 전자서명이 아닙니다.</p>
    ` : `<p class="muted">이 제안은 ${escapeHTML(x.status)} 상태입니다.
      ${x.decisionAt ? `<br>${escapeHTML(x.signer)} · ${timestamp(x.decisionAt)}` : ""}</p>`}`;
            $("previewDialog").showModal();
        }

        function decide(id, status) {
            const p = currentProject();
            const proposal = p.proposals.find(x => x.id === id);
            if (!proposal || proposal.status !== "응답 대기")
                return notify("이미 처리된 제안입니다.");
            const signer = $("signer").value.trim();
            const comment = $("decisionComment").value.trim();
            if (!signer) return notify("확인자 이름을 입력하세요.");
            if (status === "승인" && !$("approveCheck").checked)
                return notify("승인 내용을 확인하고 체크해주세요.");
            if (status === "수정 요청" && !comment)
                return notify("수정이 필요한 내용을 입력하세요.");
            if (!commit(s => {
                const x = s.projects.find(y => y.id === p.id).proposals.find(y => y.id === id);
                Object.assign(x, { status, signer, comment, decisionAt: new Date().toISOString() });
            })) return;
            closeDialog("previewDialog");
            renderProject();
            notify(status === "승인" ? "승인한 변경을 현재 범위에 반영했습니다." : "수정 요청을 기록했습니다.");
        }

        function withdraw(id) {
            const p = currentProject();
            const x = p.proposals.find(x => x.id === id);
            if (!x || x.status !== "응답 대기") return;
            if (!confirm("이 제안을 철회할까요? 철회한 제안은 승인할 수 없습니다.")) return;
            if (!commit(s => {
                s.projects.find(y => y.id === p.id).proposals.find(y => y.id === id).status = "철회";
            })) return;
            renderProject();
            notify("제안을 철회했습니다.");
        }

        function showHistory() {
            selectedId = null;
            nav(true);
            const items = state.projects.flatMap(p =>
                p.proposals.filter(x => x.status === "승인").map(x => ({ p, x }))
            ).sort((a, b) => b.x.decisionAt.localeCompare(a.x.decisionAt));
            $("main").innerHTML = `
    <div class="eyebrow">AGREEMENT HISTORY</div>
    <h1>승인 이력</h1>
    <p class="muted">고객과 합의한 변경 내용을 확인하세요.</p>
    <section class="card">
      ${items.length ? items.map(({ p, x }) => `
        <article class="history-item">
          <div class="row"><strong>${escapeHTML(p.name)} · v${x.version}</strong>${badge("승인")}</div>
          <p class="pre" style="margin-top:12px">${escapeHTML(x.scope)}</p>
          <div class="row"><span>추가 ${money(x.amount)}</span>
            <button onclick="openProject('${p.id}')">프로젝트 열기</button></div>
          <small>${escapeHTML(x.signer)} · ${timestamp(x.decisionAt)}</small>
        </article>`).join("") : `<div class="empty"><h2>아직 승인된 변경이 없습니다</h2>
          <p>프로젝트에서 변경 제안을 만들고 승인 흐름을 테스트해보세요.</p></div>`}
    </section>`;
        }

        /* Refresh local state when another tab writes to the same storage. */
        window.addEventListener("storage", event => {
            if (event.key === KEY) {
                try {
                    const next = JSON.parse(event.newValue || '{"projects":[]}');
                    if (Array.isArray(next.projects)) {
                        state = next;
                        document.querySelectorAll("dialog[open]").forEach(d => d.close());
                        goHome();
                        notify("다른 탭의 변경 사항을 불러왔습니다.");
                    }
                } catch { notify("다른 탭의 데이터를 불러오지 못했습니다."); }
            }
        });

        goHome();
    </script>
</body>

</html>
